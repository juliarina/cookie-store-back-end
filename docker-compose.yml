services:
  postgres:
    image: postgres:16-alpine
    container_name: online-shop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: online_shop_vibe
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: online-shop-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  adminer:
    image: adminer
    container_name: online-shop-adminer
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres-data:
  redis-data: